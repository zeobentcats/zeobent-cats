<head>

<body>
<div id="top"></div>
<div class="page-h"><h1 data-i="t6">Solicitar producto</h1><p data-i="i6">Consumidores, minoristas y mayoristas, de Argentina o del exterior. Costos y forma de pago se acuerdan según el destino.</p></div>
<main>
<section class="sec">
  <form data-s="Pedido - Zeobent Cat's" class="box2">
    <div class="two">
      <label><span data-i="f_type">Soy</span><select name="tipo"><option data-i="o1">Consumidor final</option><option data-i="o2">Minorista</option><option data-i="o3">Mayorista / distribuidor</option></select></label>
      <label><span data-i="f_country">País y ciudad</span><input name="pais" required></label>
    </div>
    <div class="two">
      <label><span data-i="f_name">Su nombre</span><input name="nombre" required></label>
      <label><span>Email</span><input type="email" name="email" required></label>
    </div>
    <div class="two">
      <label><span data-i="f_prod">Producto</span><select name="producto"><option data-id="pack-lanzamiento">Pack Lanzamiento 3 × 4 kg (12 kg)</option><option data-id="bolsa-4kg">Bolsa de 3,6 kg / 4 kg</option><option data-id="bolsa-10kg">Bolsa de 10 kg</option><option data-id="caja-18lb">Caja de 18.5 lb</option><option data-id="granel" data-i="pb2">A granel</option><option data-id="espera" data-i="pw">Lista de espera: merch y feeder</option></select></label>
      <label><span data-i="f_qty">Cantidad</span><input name="cantidad" required></label>
    </div>
    <label><span data-i="f_msg">Mensaje</span><textarea name="mensaje" rows="3"></textarea></label>
    <input class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn" data-i="f_send">Enviar</button><p class="st" role="status"></p>
  </form>
</section>
</main>
<div id="foot"></div>
<script src="data/config.js"></script>

</body>
</html>
